version: '3.8'

services:
  aiglass:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiglass
    restart: unless-stopped
    
    # Проброс портов
    ports:
      - "8081:8081"      # Веб-сервис
      - "12345:12345/udp" # IMU UDP
    
    # Переменные окружения (читаются из файла .env)
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - BLIND_PATH_MODEL=${BLIND_PATH_MODEL:-model/yolo-seg.pt}
      - OBSTACLE_MODEL=${OBSTACLE_MODEL:-model/yoloe-11l-seg.pt}
      - YOLOE_MODEL_PATH=${YOLOE_MODEL_PATH:-model/yoloe-11l-seg.pt}
      - ENABLE_TTS=${ENABLE_TTS:-true}
      - TTS_INTERVAL_SEC=${TTS_INTERVAL_SEC:-1.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    
    # Монтирование томов
    volumes:
      - ./model:/app/model:ro              # Файлы моделей (только чтение)
      - ./recordings:/app/recordings       # Файлы записей
      - ./music:/app/music:ro              # Аудиофайлы (только чтение)
      - ./voice:/app/voice:ro              # Голосовые файлы (только чтение)
      - ./static:/app/static:ro            # Статические файлы (только чтение)
      - ./templates:/app/templates:ro      # Файлы шаблонов (только чтение)
    
    # Поддержка GPU (требуется nvidia-docker)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # Зависимые сервисы (опционально, например, если нужна база данных)
    # depends_on:
    #   - redis
    
    # Сетевой режим
    network_mode: bridge
    
    # Проверка работоспособности
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Опционально: добавить Redis для кэширования
